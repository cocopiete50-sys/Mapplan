<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Globe 3D</title>

<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Outfit',sans-serif; }

#map { position:absolute; inset:0; }

.maplibregl-ctrl-logo, .maplibregl-ctrl-attrib { display:none !important; }
.maplibregl-ctrl-group { display:none !important; }
.maplibregl-canvas { touch-action:none; }

/* ── LOADER ── */
#loader {
  position:fixed; inset:0; z-index:9999;
  background:#000;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
  transition:opacity .6s ease;
}
.loader-dot {
  width:56px; height:56px; border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #4fc3f7, #0277bd 60%, #01579b);
  box-shadow:0 0 30px rgba(79,195,247,0.5);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{transform:scale(1);box-shadow:0 0 30px rgba(79,195,247,0.5)} 50%{transform:scale(1.08);box-shadow:0 0 50px rgba(79,195,247,0.8)} }
#loader h1 {
  font-size:28px; font-weight:700; letter-spacing:-0.5px;
  background:linear-gradient(135deg,#fff 30%,#4fc3f7);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
#loader-bar { width:140px; height:2px; background:rgba(255,255,255,0.08); border-radius:2px; overflow:hidden; }
#loader-fill { height:100%; width:10%; background:linear-gradient(90deg,#4fc3f7,#29b6f6); border-radius:2px; transition:width .3s ease; }
#loader-msg { font-size:11px; color:rgba(255,255,255,0.3); letter-spacing:1.5px; text-transform:uppercase; }

/* ── SEARCH ── */
#search-box {
  position:fixed; top:max(16px, env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
  z-index:100; width:min(440px, calc(100vw - 24px));
}
#search-inner {
  display:flex; align-items:center; gap:10px;
  background:rgba(15,15,18,0.9);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:16px; padding:0 15px; height:50px;
  box-shadow:0 4px 24px rgba(0,0,0,0.8);
  transition:border-color .2s, box-shadow .2s;
}
#search-inner:focus-within {
  border-color:rgba(79,195,247,0.5);
  box-shadow:0 4px 24px rgba(0,0,0,0.8), 0 0 0 3px rgba(79,195,247,0.18);
}
#search-input {
  flex:1; border:none; background:transparent;
  color:#fff; font-family:'Outfit',sans-serif; font-size:15px;
  outline:none; min-width:0;
}
#search-input::placeholder { color:rgba(255,255,255,0.28); }
.s-icon { color:rgba(255,255,255,0.3); flex-shrink:0; }
#s-clear {
  background:rgba(255,255,255,0.1); border:none; border-radius:50%;
  width:22px; height:22px; color:rgba(255,255,255,0.5);
  cursor:pointer; font-size:14px; display:none;
  align-items:center; justify-content:center; flex-shrink:0;
}
#s-clear:hover { background:rgba(255,255,255,0.2); }
#autocomplete {
  margin-top:7px;
  background:rgba(15,15,18,0.95);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:14px; overflow:hidden; display:none;
  box-shadow:0 10px 40px rgba(0,0,0,0.9);
}
.ac-row {
  display:flex; align-items:center; gap:11px;
  padding:12px 15px; cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,0.05);
  transition:background .1s; -webkit-user-select:none;
}
.ac-row:last-child { border-bottom:none; }
.ac-row:hover, .ac-row:active { background:rgba(79,195,247,0.1); }
.ac-ico {
  width:32px; height:32px; border-radius:9px;
  background:rgba(79,195,247,0.12);
  display:flex; align-items:center; justify-content:center;
  font-size:15px; flex-shrink:0;
}
.ac-main { font-size:14px; font-weight:500; color:#fff; }
.ac-sub  { font-size:11.5px; color:rgba(255,255,255,0.36); margin-top:1px; }

/* ── RIGHT PANEL ── */
#right-panel {
  position:fixed; top:max(16px, env(safe-area-inset-top)); right:14px;
  z-index:100; display:flex; flex-direction:column; gap:8px;
}
.r-btn {
  width:44px; height:44px;
  background:rgba(15,15,18,0.9);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.1); border-radius:13px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:rgba(255,255,255,0.72);
  box-shadow:0 2px 14px rgba(0,0,0,0.7);
  transition:transform .12s, background .12s;
  user-select:none; -webkit-user-select:none; font-size:18px;
}
.r-btn:hover, .r-btn:active { transform:scale(1.07); background:rgba(35,35,40,0.95); }
.r-btn.on { color:#4fc3f7; border-color:rgba(79,195,247,0.4); }

/* ── LAYER PILLS ── */
#layers {
  position:fixed; bottom:max(100px, calc(env(safe-area-inset-bottom) + 90px)); right:14px;
  z-index:100; display:flex; flex-direction:column; gap:7px;
}
.l-btn {
  padding:8px 13px;
  background:rgba(15,15,18,0.9);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.1); border-radius:11px;
  color:rgba(255,255,255,0.6); font-family:'Outfit',sans-serif;
  font-size:12px; font-weight:600; cursor:pointer;
  display:flex; align-items:center; gap:5px;
  box-shadow:0 2px 12px rgba(0,0,0,0.6);
  transition:transform .12s, background .12s, color .12s;
  white-space:nowrap; user-select:none; -webkit-user-select:none;
}
.l-btn:hover, .l-btn:active { transform:scale(1.04); }
.l-btn.on { color:#4fc3f7; border-color:rgba(79,195,247,0.38); background:rgba(79,195,247,0.1); }

/* ── ZOOM ── */
#zoom-wrap {
  position:fixed; bottom:max(100px, calc(env(safe-area-inset-bottom) + 90px)); left:14px;
  z-index:100; display:flex; flex-direction:column; gap:6px;
}
.z-btn {
  width:42px; height:42px;
  background:rgba(15,15,18,0.9);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.1); border-radius:12px;
  color:rgba(255,255,255,0.75); font-size:22px; font-weight:300;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; box-shadow:0 2px 12px rgba(0,0,0,0.6);
  transition:transform .12s; user-select:none; -webkit-user-select:none;
}
.z-btn:hover, .z-btn:active { transform:scale(1.07); }

/* ── INFO BAR ── */
#info-bar {
  position:fixed;
  bottom:max(18px, env(safe-area-inset-bottom));
  left:50%; transform:translateX(-50%);
  z-index:100;
  display:flex; align-items:stretch;
  background:rgba(15,15,18,0.9);
  backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:14px; overflow:hidden;
  box-shadow:0 4px 28px rgba(0,0,0,0.8);
  cursor:pointer; user-select:none;
}
.i-seg {
  padding:9px 16px;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  border-right:1px solid rgba(255,255,255,0.06);
  transition:background .1s; min-width:88px;
}
.i-seg:last-child { border-right:none; }
.i-seg:active { background:rgba(255,255,255,0.06); }
.i-lbl { font-size:9.5px; color:rgba(255,255,255,0.28); text-transform:uppercase; letter-spacing:1px; font-weight:500; }
.i-val { font-size:12.5px; color:#fff; font-weight:500; font-variant-numeric:tabular-nums; }

/* ── PLACE CARD ── */
#place-card {
  position:fixed;
  bottom:max(88px, calc(env(safe-area-inset-bottom) + 78px));
  left:50%; transform:translateX(-50%) translateY(14px);
  z-index:100;
  width:min(340px, calc(100vw - 28px));
  background:rgba(15,15,18,0.96);
  backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px);
  border:1px solid rgba(255,255,255,0.11);
  border-radius:20px; padding:17px 17px 15px;
  box-shadow:0 12px 50px rgba(0,0,0,0.9);
  opacity:0; pointer-events:none;
  transition:opacity .25s, transform .25s cubic-bezier(.32,1.2,.4,1);
}
#place-card.show { opacity:1; pointer-events:all; transform:translateX(-50%) translateY(0); }
#pc-x {
  position:absolute; top:12px; right:12px;
  background:rgba(255,255,255,0.08); border:none; border-radius:50%;
  width:26px; height:26px; color:rgba(255,255,255,0.5);
  cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center;
}
#pc-x:active { background:rgba(255,255,255,0.16); }
#pc-name { font-size:16px; font-weight:600; color:#fff; padding-right:32px; line-height:1.35; margin-bottom:3px; }
#pc-ll   { font-size:11.5px; color:rgba(255,255,255,0.36); margin-bottom:13px; }
#pc-btns { display:flex; gap:7px; }
.pc-b {
  flex:1; background:rgba(79,195,247,0.12);
  border:1px solid rgba(79,195,247,0.2);
  border-radius:11px; padding:9px 4px;
  color:#4fc3f7; font-family:'Outfit',sans-serif;
  font-size:11px; font-weight:600; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  transition:background .12s;
}
.pc-b:active { background:rgba(79,195,247,0.22); }
.pc-b svg { width:16px; height:16px; }

/* ── TOAST ── */
#toast {
  position:fixed; top:78px; left:50%; transform:translateX(-50%);
  background:rgba(15,15,18,0.97);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:10px; padding:8px 18px;
  color:#fff; font-size:13px; font-weight:500;
  z-index:200; opacity:0; pointer-events:none;
  transition:opacity .22s; white-space:nowrap;
  backdrop-filter:blur(20px);
}
#toast.show { opacity:1; }
</style>

</head>
<body>

<!-- LOADER -->

<div id="loader">
  <div class="loader-dot"></div>
  <h1>Globe 3D</h1>
  <div id="loader-bar"><div id="loader-fill"></div></div>
  <div id="loader-msg">Initialisation…</div>
</div>

<!-- MAP -->

<div id="map"></div>

<!-- SEARCH -->

<div id="search-box">
  <div id="search-inner">
    <svg class="s-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="search-input" type="text" placeholder="Rechercher un lieu…" autocomplete="off" spellcheck="false"/>
    <button id="s-clear">×</button>
  </div>
  <div id="autocomplete"></div>
</div>

<!-- RIGHT BUTTONS -->

<div id="right-panel">
  <div class="r-btn" id="btn-geo">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <circle cx="12" cy="12" r="3"/>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
    </svg>
  </div>
  <div class="r-btn" id="btn-reset">⟳</div>
</div>

<!-- LAYERS -->

<div id="layers">
  <button class="l-btn on" data-layer="satellite">🛰 Satellite</button>
  <button class="l-btn" data-layer="streets">🗺 Carte</button>
  <button class="l-btn" data-layer="outdoors">🏔 Relief</button>
</div>

<!-- ZOOM -->

<div id="zoom-wrap">
  <div class="z-btn" id="btn-zin">+</div>
  <div class="z-btn" id="btn-zout">−</div>
</div>

<!-- INFO BAR -->

<div id="info-bar">
  <div class="i-seg"><span class="i-lbl">Latitude</span><span class="i-val" id="v-lat">—</span></div>
  <div class="i-seg"><span class="i-lbl">Longitude</span><span class="i-val" id="v-lng">—</span></div>
  <div class="i-seg"><span class="i-lbl">Zoom</span><span class="i-val" id="v-zoom">—</span></div>
</div>

<!-- PLACE CARD -->

<div id="place-card">
  <button id="pc-x">×</button>
  <div id="pc-name">Lieu</div>
  <div id="pc-ll"></div>
  <div id="pc-btns">
    <button class="pc-b" id="pc-fly">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>Aller
    </button>
    <button class="pc-b" id="pc-copy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="9" y="9" width="13" height="13" rx="2"/>
        <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
      </svg>Copier
    </button>
    <button class="pc-b" id="pc-gm">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
        <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
      </svg>G.Maps
    </button>
  </div>
</div>

<div id="toast"></div>

<script>
// ── STYLES (tuiles gratuites, aucun token requis) ────────
const TILE_SOURCES = {
  satellite: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  streets:   'https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
  outdoors:  'https://a.tile.opentopomap.org/{z}/{x}/{y}.png'
};

function makeStyle(layer) {
  return {
    version: 8,
    glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
    sources: {
      base: {
        type: 'raster',
        tiles: [TILE_SOURCES[layer]],
        tileSize: 256,
        attribution: layer === 'satellite'
          ? '© Esri, DigitalGlobe'
          : layer === 'streets'
          ? '© CartoDB © OpenStreetMap'
          : '© OpenTopoMap'
      }
    },
    layers: [{ id: 'base-tiles', type: 'raster', source: 'base' }]
  };
}

// ── LOADER ──────────────────────────────────────────────
const fill = document.getElementById('loader-fill');
const msg  = document.getElementById('loader-msg');
function prog(p, t) { fill.style.width = p + '%'; if (t) msg.textContent = t; }
prog(20, 'Création du globe…');

// ── MAP INIT ─────────────────────────────────────────────
const map = new maplibregl.Map({
  container: 'map',
  style: makeStyle('satellite'),
  center: [10, 20],
  zoom: 1.5,
  projection: { type: 'globe' },
  antialias: true,
  attributionControl: false,
  renderWorldCopies: false,
  maxPitch: 85,
  fadeDuration: 300,
});

prog(50, 'Chargement des tuiles satellite…');

// ── FOG / ATMOSPHÈRE ────────────────────────────────────
function applyFog(layer) {
  try {
    map.setFog({
      color: layer === 'satellite' ? 'rgb(10,20,50)' : 'rgb(200,210,230)',
      'high-color': layer === 'satellite' ? 'rgb(40,90,180)' : 'rgb(100,160,240)',
      'horizon-blend': 0.07,
      'space-color': 'rgb(3,5,15)',
      'star-intensity': layer === 'satellite' ? 0.5 : 0.15
    });
  } catch(e) {}
}

map.on('style.load', () => {
  applyFog(curLayer);
  prog(80, 'Atmosphère configurée…');
});

map.on('load', () => {
  prog(100, 'Prêt !');
  setTimeout(() => {
    const el = document.getElementById('loader');
    if (!el) return;
    el.style.opacity = '0';
    setTimeout(() => el.remove(), 700);
  }, 400);
});

// Fallback si le chargement prend trop de temps
setTimeout(() => {
  const el = document.getElementById('loader');
  if (el) { el.style.opacity = '0'; setTimeout(() => el.remove(), 700); }
}, 8000);

// ── LAYER SWITCHER ──────────────────────────────────────
let curLayer = 'satellite';
document.querySelectorAll('.l-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const l = btn.dataset.layer;
    if (l === curLayer) return;
    curLayer = l;
    document.querySelectorAll('.l-btn').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    map.setStyle(makeStyle(l));
  });
});

// ── INFO BAR ────────────────────────────────────────────
map.on('move', () => {
  const c = map.getCenter();
  document.getElementById('v-lat').textContent  = c.lat.toFixed(4) + '°';
  document.getElementById('v-lng').textContent  = c.lng.toFixed(4) + '°';
  document.getElementById('v-zoom').textContent = map.getZoom().toFixed(1);
});
map.on('mousemove', e => {
  document.getElementById('v-lat').textContent  = e.lngLat.lat.toFixed(4) + '°';
  document.getElementById('v-lng').textContent  = e.lngLat.lng.toFixed(4) + '°';
});
document.getElementById('info-bar').addEventListener('click', () => {
  const lat = document.getElementById('v-lat').textContent;
  const lng = document.getElementById('v-lng').textContent;
  navigator.clipboard.writeText(lat + ', ' + lng).catch(() => {});
  toast('📋 Coordonnées copiées !');
});

// ── CLIC SUR LA CARTE ───────────────────────────────────
let curPlace = null;
map.on('click', async e => {
  const { lng, lat } = e.lngLat;
  let name = lat.toFixed(3) + '°, ' + lng.toFixed(3) + '°';
  try {
    const r = await fetch(
      `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`,
      { headers: { 'Accept-Language': 'fr' } }
    );
    const d = await r.json();
    if (d.display_name) name = d.display_name.split(',').slice(0, 2).join(',').trim();
  } catch (err) {}
  curPlace = { name, lat, lng };
  document.getElementById('pc-name').textContent = name;
  document.getElementById('pc-ll').textContent   = lat.toFixed(5) + '°N, ' + lng.toFixed(5) + '°E';
  document.getElementById('place-card').classList.add('show');
});

document.getElementById('pc-x').addEventListener('click', () => {
  document.getElementById('place-card').classList.remove('show');
});
document.getElementById('pc-fly').addEventListener('click', () => {
  if (!curPlace) return;
  map.flyTo({ center: [curPlace.lng, curPlace.lat], zoom: 10, duration: 2200, essential: true });
  document.getElementById('place-card').classList.remove('show');
});
document.getElementById('pc-copy').addEventListener('click', () => {
  if (!curPlace) return;
  navigator.clipboard.writeText(curPlace.lat.toFixed(6) + ', ' + curPlace.lng.toFixed(6)).catch(() => {});
  toast('📋 Copié !');
});
document.getElementById('pc-gm').addEventListener('click', () => {
  if (!curPlace) return;
  window.open('https://maps.google.com/?q=' + curPlace.lat + ',' + curPlace.lng, '_blank');
});

// ── GÉOLOCALISATION ─────────────────────────────────────
document.getElementById('btn-geo').addEventListener('click', () => {
  const btn = document.getElementById('btn-geo');
  if (!navigator.geolocation) { toast('Géolocalisation non disponible'); return; }
  btn.classList.add('on');
  navigator.geolocation.getCurrentPosition(pos => {
    map.flyTo({
      center: [pos.coords.longitude, pos.coords.latitude],
      zoom: 12, duration: 2500, essential: true
    });
    toast('📍 Position trouvée !');
    setTimeout(() => btn.classList.remove('on'), 3000);
  }, () => {
    btn.classList.remove('on');
    toast('Géolocalisation refusée');
  }, { enableHighAccuracy: true, timeout: 10000 });
});

// ── RESET ───────────────────────────────────────────────
document.getElementById('btn-reset').addEventListener('click', () => {
  map.flyTo({ center: [10, 20], zoom: 1.5, pitch: 0, bearing: 0, duration: 2000, essential: true });
  document.getElementById('place-card').classList.remove('show');
});

// ── ZOOM ────────────────────────────────────────────────
document.getElementById('btn-zin').addEventListener('click',  () => map.zoomIn({ duration: 300 }));
document.getElementById('btn-zout').addEventListener('click', () => map.zoomOut({ duration: 300 }));

// ── RECHERCHE ───────────────────────────────────────────
const inp = document.getElementById('search-input');
const ac  = document.getElementById('autocomplete');
const clr = document.getElementById('s-clear');
let st = null;

inp.addEventListener('input', () => {
  const q = inp.value.trim();
  clr.style.display = q ? 'flex' : 'none';
  clearTimeout(st);
  if (q.length < 2) { ac.style.display = 'none'; return; }
  st = setTimeout(() => doSearch(q), 320);
});
clr.addEventListener('click', () => {
  inp.value = ''; clr.style.display = 'none'; ac.style.display = 'none'; inp.focus();
});

async function doSearch(q) {
  try {
    const r = await fetch(
      `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=6&accept-language=fr`
    );
    const data = await r.json();
    renderAC(data);
  } catch { ac.style.display = 'none'; }
}

const ICO = { city:'🏙', town:'🏘', village:'🏡', country:'🌍', administrative:'📍', state:'📍', airport:'✈️', hotel:'🏨', restaurant:'🍽', museum:'🏛', park:'🌿' };

function renderAC(results) {
  if (!results.length) { ac.style.display = 'none'; return; }
  ac.innerHTML = '';
  results.forEach(item => {
    const p    = item.display_name.split(',');
    const main = p[0].trim();
    const sub  = p.slice(1, 3).join(',').trim();
    const ico  = ICO[item.type] || ICO[item.class] || '📍';
    const d = document.createElement('div');
    d.className = 'ac-row';
    d.innerHTML = `<div class="ac-ico">${ico}</div><div><div class="ac-main">${main}</div><div class="ac-sub">${sub}</div></div>`;
    d.addEventListener('click', () => {
      const lat = parseFloat(item.lat), lng = parseFloat(item.lon);
      const z   = item.type === 'country' ? 4 : item.type === 'state' ? 6 : 10;
      map.flyTo({ center: [lng, lat], zoom: z, duration: 2200, essential: true });
      curPlace = { name: main, lat, lng };
      document.getElementById('pc-name').textContent = main;
      document.getElementById('pc-ll').textContent   = lat.toFixed(5) + '°N, ' + lng.toFixed(5) + '°E';
      document.getElementById('place-card').classList.add('show');
      inp.value = main; ac.style.display = 'none';
    });
    ac.appendChild(d);
  });
  ac.style.display = 'block';
}

inp.addEventListener('keydown', e => {
  if (e.key === 'Enter') { const f = ac.querySelector('.ac-row'); if (f) f.click(); }
  if (e.key === 'Escape') ac.style.display = 'none';
});
document.addEventListener('touchstart', e => {
  if (!e.target.closest('#search-box')) ac.style.display = 'none';
}, { passive: true });
document.addEventListener('click', e => {
  if (!e.target.closest('#search-box')) ac.style.display = 'none';
});

// ── TOAST ────────────────────────────────────────────────
let tt = null;
function toast(m) {
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
